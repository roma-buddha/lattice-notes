[package]
name = "notus"
version = "0.3.0"
description = "Markdown vaults, folders, and notes"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
rfd = "0.15"
trash = "5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
